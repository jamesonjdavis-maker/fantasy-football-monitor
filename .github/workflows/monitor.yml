name: Fantasy Football Monitor

on:
  schedule:
    # 13:00 UTC ≈ 9am ET daily. Injury designations and waiver activity update
    # through the week, so a daily check catches most changes.
    - cron: "0 13 * * *"
    # Extra check Sunday late-morning ET before early games lock.
    - cron: "30 16 * * 0"
  workflow_dispatch: # manual "Run workflow" button
    inputs:
      always_notify:
        description: "Send an alert even if nothing is flagged (test the webhook)"
        type: boolean
        default: false

# Needed so the job can commit the day's snapshot back to the repo for diffing.
permissions:
  contents: write

concurrency:
  group: ff-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          # ESPN — cookies are account-level (one pair covers all leagues).
          # Multi-league: ESPN_LEAGUES = "Label:leagueId:teamId, Label2:leagueId2:teamId2"
          # Single league still works via ESPN_LEAGUE_ID / ESPN_TEAM_ID.
          ESPN_LEAGUES: ${{ secrets.ESPN_LEAGUES }}
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          # Sleeper
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
          SLEEPER_USER_ID: ${{ secrets.SLEEPER_USER_ID }}
          SLEEPER_USERNAME: ${{ secrets.SLEEPER_USERNAME }}
          # Alerting — ntfy is the default; Discord optional (set either/both)
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Daily 13:00 UTC run always sends (a "daily digest", quiet or not).
          # The Sunday 16:30 run and unchecked manual runs only ping on news.
          ALWAYS_NOTIFY: ${{ github.event.schedule == '0 13 * * *' || inputs.always_notify }}
        run: python -m ffmonitor.main

      - name: Commit updated snapshot
        run: |
          git config user.name "ff-monitor-bot"
          git config user.email "ff-monitor-bot@users.noreply.github.com"
          git add data/snapshot-*.json data/latest.json
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "chore: daily snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
